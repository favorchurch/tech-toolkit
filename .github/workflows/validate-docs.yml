name: Validate public toolkit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Markdown, local links, templates and sensitive content
        run: python3 scripts/check_docs.py
